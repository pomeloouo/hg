// ════════════════════════════════════════════════════════
//  以下為頁面邏輯，不需修改
// ════════════════════════════════════════════════════════

let current = 0, timer = null;
let IMG_FOLDER = '', IMG_FILES = [];

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderProduct(p) {
  // 頁面標題
  document.getElementById('pageTitle').textContent = `${p.brand} ${p.title1}`;

  // Navbar 選中
  const sel = document.getElementById('navSelect');
  sel.value = `product.html?id=${p.id}`;

  // 麵包屑
  document.getElementById('breadcrumb').textContent = p.breadcrumb;

  // 品牌 / 標題 / 型號
  document.getElementById('brandTag').textContent = p.brand;
  const titleEl = document.getElementById('productTitle');
  titleEl.textContent = '';
  titleEl.appendChild(document.createTextNode(p.title1));
  if (p.title2) { titleEl.appendChild(document.createElement('br')); titleEl.appendChild(document.createTextNode(p.title2)); }
  document.getElementById('modelNo').textContent = p.model;

  // 價格
  const psEl = document.getElementById('priceSale');
  psEl.innerHTML = '<sup>$</sup>' + esc(p.priceSale);
  const poEl = document.getElementById('priceOrig');
  if (p.priceOrig) { poEl.textContent = '$' + p.priceOrig; poEl.style.display = ''; }
  else { poEl.style.display = 'none'; }

  // 重點清單
  const ul = document.getElementById('pointsList');
  ul.innerHTML = p.points.map(pt => `<li>${esc(pt)}</li>`).join('');

  // 快速規格 chips
  const cw = document.getElementById('chipsWrap');
  cw.innerHTML = p.chips.map(c => `<div class="spec-chip"><div class="val">${esc(c.val)}</div><div class="key">${esc(c.key)}</div></div>`).join('');
  cw.style.display = p.chips.length ? '' : 'none';

  // 特色卡片
  document.getElementById('featGrid').innerHTML = p.featCards.map(fc =>
    `<div class="feature-card"><div class="feature-icon">${fc.icon}</div><div class="feature-title">${esc(fc.title)}</div></div>`
  ).join('');

  // 規格一覽
  document.getElementById('featH4').textContent = p.featH4;
  document.getElementById('featSpecsGrid').innerHTML = p.featSpecs.map(s =>
    `<div class="fs-row"><span class="fs-icon">▸</span><span class="fs-text">${esc(s)}</span></div>`
  ).join('');

  // 商品規格表
  const tbody = document.getElementById('specTableBody');
  tbody.innerHTML = p.specRows.map(r => {
    const tdContent = r.link
      ? `<a href="#">${esc(r.td)}</a>`
      : esc(r.td);
    return `<tr><th>${esc(r.th)}</th><td>${tdContent}</td></tr>`;
  }).join('') + `<tr><th>商品規格</th><td class="multiline">${esc(p.specDetail)}</td></tr>`;

  // 圖片 carousel
  IMG_FOLDER = `img/${p.imgFolder}/`;
  IMG_FILES  = p.imgFiles || [];
  buildCarousel();
}

// ── Carousel ──
function buildCarousel() {
  const carousel = document.getElementById('mainCarousel');
  const dw = document.getElementById('dotsWrap');
  const ts = document.getElementById('thumbStrip');
  [...carousel.querySelectorAll('.slide')].forEach(s => s.remove());
  dw.innerHTML = ''; ts.innerHTML = ''; current = 0; clearInterval(timer);

  if (!IMG_FILES.length) {
    const s = document.createElement('div');
    s.className = 'slide active';
    s.innerHTML = `<div class="slide-placeholder">📷<br>請將圖片放入<br>img/${IMG_FOLDER.replace('img/','').replace('/','')}/</div>`;
    carousel.insertBefore(s, carousel.querySelector('.arrow-prev')); return;
  }
  IMG_FILES.forEach((file, i) => {
    const s = document.createElement('div');
    s.className = 'slide' + (i===0?' active':'');
    s.innerHTML = `<img src="${IMG_FOLDER}${file}" alt="商品圖${i+1}" loading="lazy">`;
    carousel.insertBefore(s, carousel.querySelector('.arrow-prev'));
    const d = document.createElement('button'); d.className='dot'+(i===0?' active':'');
    d.onclick = () => goTo(i); dw.appendChild(d);
    const t = document.createElement('div'); t.className='thumb'+(i===0?' active':'');
    t.innerHTML = `<img src="${IMG_FOLDER}${file}" alt="縮圖${i+1}">`;
    t.onclick = () => goTo(i); ts.appendChild(t);
  });
  if (IMG_FILES.length > 1) timer = setInterval(() => goTo(current+1), 1500);
}
function goTo(idx) {
  const carousel=document.getElementById('mainCarousel');
  const sl=[...carousel.querySelectorAll('.slide')], d=[...document.getElementById('dotsWrap').querySelectorAll('.dot')], t=[...document.getElementById('thumbStrip').querySelectorAll('.thumb')];
  if (!sl.length) return;
  [sl,d,t].forEach(a=>a[current]?.classList.remove('active'));
  current=(idx+sl.length)%sl.length;
  [sl,d,t].forEach(a=>a[current]?.classList.add('active'));
}
function changeSlide(dir) { clearInterval(timer); goTo(current+dir); if(IMG_FILES.length>1) timer=setInterval(()=>goTo(current+1),1500); }
document.getElementById('mainCarousel').addEventListener('mouseenter',()=>clearInterval(timer));
document.getElementById('mainCarousel').addEventListener('mouseleave',()=>{ if(IMG_FILES.length>1) timer=setInterval(()=>goTo(current+1),1500); });

// ── Tab ──
function switchTab(idx, btn) {
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-'+idx).classList.add('active');
}

// ── 啟動：讀 URL ?id= ──
(function() {
  const id = parseInt(new URLSearchParams(window.location.search).get('id')) || 1;
  const p = PRODUCTS.find(x => x.id === id) || PRODUCTS[0];
  renderProduct(p);
})();
</script>
